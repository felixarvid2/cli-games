[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinderspire"
version = "2.4.0"
description = "A deckbuilding roguelike for the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CINDERSPIRE contributors" }]
keywords = ["game", "roguelike", "deckbuilder", "terminal", "curses"]
classifiers = [
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.scripts]
cinderspire = "cinderspire.ui:main"

[tool.setuptools]
packages = ["cinderspire"]
